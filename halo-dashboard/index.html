<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halo Dashboard — Finance Panel</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="app.css">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap">
  <style>
    :root {
      --font-display: 'Satoshi', 'Inter', system-ui, sans-serif;
      --font-body:    'Satoshi', 'Inter', system-ui, sans-serif;
    }
    /* Re-tune type for Satoshi's metrics (denser than Cas Calisaya) */
    .sb-brand-n,
    .tb-greet,
    .stats-h,
    .stat-value,
    .chart-card h3,
    .sp-head h3,
    .sp-foot-v,
    .chart-foot-v,
    .access h3 {
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .sb-brand-n em,
    .tb-greet em {
      font-weight: 500;
      font-style: normal; /* Satoshi italic is faux on display — keep upright */
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="Body.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
